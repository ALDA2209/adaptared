{% macro icon(name, cls="h-5 w-5") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "panel" %}<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/>
{%- elif name == "mapa" %}<path d="M12 21s-6-5.3-6-10a6 6 0 1112 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>
{%- elif name == "comunidades" %}<circle cx="9" cy="8" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.7 0 4.5 1.6 4.5 4.3"/>
{%- elif name == "alertas" %}<path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 004 0"/>
{%- elif name == "agro" %}<path d="M12 21v-9"/><path d="M12 12c0-4-3-6-7-6 0 4 3 6 7 6z"/><path d="M12 14c0-3 2-5 6-5 0 3-2 5-6 5z"/>
{%- elif name == "reportes" %}<path d="M4 5h16v11H9l-5 4z"/>
{%- elif name == "impacto" %}<path d="M5 20V11M12 20V4M19 20v-6"/>
{%- elif name == "metodo" %}<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/>
{%- elif name == "calor" %}<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>
{%- elif name == "inundacion" %}<path d="M12 3s6 6.2 6 10.5a6 6 0 11-12 0C6 9.2 12 3 12 3z"/>
{%- elif name == "sequia" %}<path d="M4 20c2-6 6-9 12-10"/><path d="M16 10c-1-2-1-4 1-6 2 2 3 5 1 7"/><path d="M3 20h18"/>
{%- elif name == "check" %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == "x" %}<path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == "menu" %}<path d="M4 7h16M4 12h16M4 17h16"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro badge(level) -%}
<span class="badge badge-{{ level }}"><span class="dot dot-{{ level }}"></span>{{ LEVEL_LABELS_EN[level] }}</span>
{%- endmacro %}
